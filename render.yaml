# Render blueprint — ONE free web service running frontend + backend from the root Dockerfile.
# Free tier (512 MB RAM, no card) => AI=0: everything works except the AI footprint page.
# Render exposes env vars to the Docker build, and the Dockerfile declares them as ARGs.
services:
  - type: web
    name: tribhoomi
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: AI
        value: "0"
      - key: CORS_ORIGINS
        value: "*"
      - key: NEXT_PUBLIC_CESIUM_TOKEN
        sync: false     # paste your Cesium ion token in the Render dashboard
      - key: NEXT_PUBLIC_PUBLIC_URL
        sync: false     # https://<service-name>.onrender.com
