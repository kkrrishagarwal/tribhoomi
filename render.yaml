# Render blueprint: backend as a Docker web service. Pair it with the frontend on Vercel
# (set Vercel env API_URL to this service's URL). Free tier has 512 MB RAM, so AI=0.
services:
  - type: web
    name: tribhoomi-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      AI: "0"
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: "8000"
    healthCheckPath: /api/health
