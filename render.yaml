# Render blueprint — ONE free web service running frontend + backend from the root Dockerfile.
# Free tier (512 MB RAM, no card) => AI=0: everything works except the AI footprint page.
services:
  - type: web
    name: tribhoomi
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerBuildArgs:
      AI: "0"
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: NEXT_PUBLIC_PUBLIC_URL
        sync: false     # set in the Render dashboard to https://<service>.onrender.com
    healthCheckPath: /api/health
